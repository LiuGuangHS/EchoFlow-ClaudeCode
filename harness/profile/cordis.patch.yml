# EchoFlow profile patch. It applies after the dsh-base and dsh-acp-app bundle
# layers and before any user home patch or command-line overlay.
#
# Two kinds of change live here:
#   1. replace vendor defaults that name DeepSeek, before a session can resolve
#      a model (ACP initialize and session/new both read them);
#   2. disable every plugin that would reach a DeepSeek host.
#
# A launcher still adds a final hard-disable layer, so a later user patch cannot
# re-open these rows.

- id: agent-default-model
  config:
    provider: echoflow
    model: echoflow-default

- id: acp
  config:
    provider: echoflow
    model: echoflow-default

# Keep explicit URL fetch. No search provider is mounted, so a model-visible
# search fails locally with a structured WebError instead of reaching DeepSeek.
- id: web
  config:
    fetchProvider: http

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: deepseek-account
  disabled: true

- id: deepseek-llm-api-extensions
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: otel
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

# The first addon set. These are new rows, so they arrive through one insert:
# a non-insert patch row must name an id the bundles already mounted.
- insert:
    - id: hooks-claude-code
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        # Empty until the launcher points it at CLAUDE_CONFIG_DIR's hooks file;
        # the bridge stays inert rather than reading someone else's config.
        configPath: ''

    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'
      config:
        maxFiles: 500

    # Scheduling needs the Host Session controller and a Session persistence
    # backend that acknowledges session/flush; neither exists in this headless
    # ACP composition, so the row would wait forever. Keep it visible and
    # disabled until that path lands, and enable tool-schedule with it.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
      disabled: true

    - id: tool-schedule
      name: '@deepseek-ai/dsh-tool-schedule'
      disabled: true

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: echoflow-host-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0

    - id: echoflow-client-connection
      name: '@deepseek-ai/dsh-client-connection'

    - id: echoflow-file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: echoflow-workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: echoflow-session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
