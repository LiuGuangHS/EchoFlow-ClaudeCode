<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#201d17" media="(prefers-color-scheme: dark)">
    <meta name="description" content="EchoFlow Code — Claude Code 的本地优先桌面客户端。会话、改动、Agent、定时任务都摆在明处，接哪个模型你说了算。">
    <link rel="icon" href="%BASE_URL%images/app-icon.png" type="image/png">
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/noto-serif-sc-latin.woff2" as="font" type="font/woff2" crossorigin>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EchoFlow Code">
    <meta property="og:title" content="EchoFlow Code — Claude Code 的本地优先桌面客户端">
    <meta property="og:description" content="会话、改动、Agent、定时任务都摆在明处。接哪个模型你说了算，改哪一行你点头才算。">
    <meta property="og:image" content="https://code.echoflow.cn/images/banner.svg">
    <meta name="twitter:card" content="summary_large_image">
    <title>EchoFlow Code — Claude Code 的本地优先桌面客户端</title>
    <script>
      // 首帧就把语言定下来：没有保存的选择时按浏览器首选语言。只认根路径，带语言前缀
      // 的地址是用户的明确意图。规则与 src/lib/locale.js 的 resolveBrowserLocale 一致，
      // check-docs.mjs 盯着两处不漂移。
      (function () {
        try {
          var base = '%BASE_URL%'.replace(/\/+$/, '')
          if (window.location.pathname.replace(/\/+$/, '') !== base) return

          var stored = localStorage.getItem('cch-locale')
          if (stored !== 'en' && stored !== 'zh') {
            var preferredLanguage = (navigator.languages && navigator.languages[0]) || navigator.language || ''
            stored = /^zh(?:[-_]|$)/i.test(preferredLanguage) ? 'zh' : 'en'
          }

          if (stored === 'en') {
            window.location.replace(base + '/en' + window.location.search + window.location.hash)
          } else {
            document.documentElement.lang = 'zh-CN'
          }
        } catch (error) {
          // 读不到偏好就维持中文站，别让语言分流把首页整个拦死。
        }
      })()
    </script>
    <script>
      // 首帧就把主题定下来，避免深色偏好的用户先闪一下白屏。
      (function () {
        try {
          var stored = localStorage.getItem('cch-theme')
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D42DM82263"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag(){dataLayer.push(arguments)}
      gtag('js', new Date())
      gtag('config', 'G-D42DM82263')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
