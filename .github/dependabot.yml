# Dependabot configuration for EchoFlow
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root workspace dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      # Group all non-security updates together to reduce PR noise
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
      # Separate group for type definitions
      type-definitions:
        patterns:
          - "@types/*"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Desktop app dependencies
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      desktop-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "electron*"
          - "@types/*"
      # Keep Electron updates separate for careful testing
      electron:
        patterns:
          - "electron*"
      type-definitions:
        patterns:
          - "@types/*"
    labels:
      - "dependencies"
      - "desktop"
      - "automated"
    commit-message:
      prefix: "chore(desktop/deps)"

  # Adapters dependencies
  - package-ecosystem: "npm"
    directory: "/adapters"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      adapter-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "adapter"
      - "automated"
    commit-message:
      prefix: "chore(adapters/deps)"

  # Mobile dependencies
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      mobile-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "mobile"
      - "automated"
    commit-message:
      prefix: "chore(mobile/deps)"

  # Site/docs dependencies
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      site-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "docs"
      - "automated"
    commit-message:
      prefix: "chore(site/deps)"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "chore(ci/deps)"
