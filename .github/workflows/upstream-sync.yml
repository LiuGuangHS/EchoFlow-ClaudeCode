name: Upstream Sync

# Tracks upstream releases and turns each new one into a reviewable PR,
# instead of letting the fork drift 170 commits behind and merging it by hand.
#
# The merge is never *resolved* here. The sync branch points at the upstream release
# commit, so the PR is a plain `sync/upstream-vX.Y.Z -> main`: GitHub computes the
# merge when the PR opens. A clean one is ready to review; a conflicting one still
# opens, as a draft, with the file list in the body.
#
# Upstream tags are read over `ls-remote` and fetched into a private namespace.
# Upstream and fork release tags share names, so fetching tags normally would
# clobber the fork's own `vX.Y.Z` tags.

on:
  schedule:
    # Every three days at 01:20 UTC. GitHub cron's day-of-month schedule resets at month boundaries.
    - cron: '20 1 */3 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the sync branch and open/refresh the PR when the merge is clean'
        type: boolean
        default: false
      probe_only:
        description: 'Report the merge verdict without pushing anything'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: detect-and-stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # A PAT is worth configuring as UPSTREAM_SYNC_TOKEN. PRs opened with the
          # default GITHUB_TOKEN do not trigger `pull_request` workflows, so
          # pr-quality.yml would not run on the sync PR at all.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Add the upstream remote
        run: |
          git remote add upstream https://github.com/NanmiCoder/cc-haha.git 2>/dev/null \
            || git remote set-url upstream https://github.com/NanmiCoder/cc-haha.git
          git remote -v

      # A scheduled run publishes by default: that is the point of the schedule. A
      # manual run does what the operator asked for, which defaults to a dry probe.
      - name: Resolve run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.probe_only }}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan upstream sync
        id: plan
        env:
          MODE_PUBLISH: ${{ steps.mode.outputs.publish }}
          UPSTREAM_SYNC_REPORT_DIR: ${{ runner.temp }}/upstream-sync
        run: |
          args=(--base main)
          if [ "$MODE_PUBLISH" = "true" ]; then
            args+=(--publish)
          fi
          bun run scripts/upstream/sync.ts "${args[@]}"

      - name: Open or refresh the sync pull request
        # Both outcomes open a PR: a conflicting release opens as a draft, so the
        # sync is still tracked and the conflict list is visible on the PR itself.
        if: >-
          (steps.plan.outputs.action == 'open-pr'
            || steps.plan.outputs.action == 'needs-conflict-resolution')
          && steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TAG: ${{ steps.plan.outputs.tag }}
          PR_TITLE: ${{ steps.plan.outputs.pr_title }}
          PR_BODY: ${{ steps.plan.outputs.pr_body }}
          PR_DRAFT: ${{ steps.plan.outputs.pr_draft }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$PR_TITLE" --body "$PR_BODY"
            if [ "$PR_DRAFT" = "true" ]; then
              gh pr ready --undo "$existing" || true
            fi
            echo "Updated existing PR #$existing for $TAG."
          else
            draft_flag=()
            if [ "$PR_DRAFT" = "true" ]; then
              draft_flag=(--draft)
            fi
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              "${draft_flag[@]}"
          fi

      - name: Flag the conflict on the run
        if: >-
          steps.plan.outputs.action == 'needs-conflict-resolution'
          && steps.mode.outputs.publish != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          CONFLICTS: ${{ steps.plan.outputs.conflicts }}
        run: |
          echo "::warning title=Upstream sync needs a human::${TAG} conflicts in ${CONFLICTS} file(s); run with publish enabled to open the draft PR."

      - name: Write run summary
        if: always()
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          TAG: ${{ steps.plan.outputs.tag }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          CONFLICTS: ${{ steps.plan.outputs.conflicts }}
          CONFLICT_FILES: ${{ steps.plan.outputs.conflict_files }}
          UPSTREAM_COMMITS: ${{ steps.plan.outputs.upstream_commits }}
          MERGE_OUTPUT: ${{ steps.plan.outputs.merge_output }}
        run: |
          {
            echo "## Upstream sync"
            echo
            case "$ACTION" in
              already-synced)
                echo "Fork already tracks \`${TAG}\`."
                ;;
              open-pr)
                echo "\`${TAG}\` merged cleanly. Branch \`${BRANCH}\` is ready for review."
                ;;
              needs-conflict-resolution)
                echo "\`${TAG}\` conflicts. ${CONFLICTS} file(s) need a human decision."
                echo
                echo "A draft PR targeting \`main\` carries this state; resolve the conflicts there."
                echo
                echo "\`\`\`"
                echo "$CONFLICT_FILES"
                echo "\`\`\`"
                ;;
              *)
                echo "No sync needed."
                ;;
            esac
            if [ -n "$UPSTREAM_COMMITS" ] && [ "$UPSTREAM_COMMITS" != "0" ]; then
              echo
              echo "Upstream commits: ${UPSTREAM_COMMITS}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: upstream-sync-probe
          path: |
            ${{ runner.temp }}/upstream-sync
          if-no-files-found: ignore
          retention-days: 14
