name: Deploy React Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'package.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag (or bare version) whose assets are mirrored into /update/'
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Build React site
        run: npm --prefix site run build
        env:
          DOCS_BASE: /

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Mirror the update channel files into site/dist/update/ and write
      # site/dist/download/manifest.json before upload, so a failed mirror
      # fails the workflow instead of silently deploying without them.
      # Without a release_tag (ordinary docs deploys) this re-mirrors 'latest'.
      - name: Mirror update metadata and build download manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
        run: bun run scripts/site-release-manifest.ts --release "$RELEASE_TAG" --out site/dist --repo "$GITHUB_REPOSITORY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
