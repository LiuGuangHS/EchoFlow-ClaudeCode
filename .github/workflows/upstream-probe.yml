name: Upstream Probe

# Read-only status reporting only. This workflow never creates branches, never
# opens PRs, never resolves or commits anything: the sync branch + PR mechanism
# in scripts/upstream/sync.ts stays manual because PRs opened with the default
# GITHUB_TOKEN do not trigger `pull_request` workflows and never got CI results
# (see docs/internals/contributing.md "自动化边界"). What this adds is the one
# piece that automation removed: you stop finding out upstream moved three
# releases ago on the day you finally look.

on:
  schedule:
    - cron: '0 1 * * *' # Daily 09:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-probe
  cancel-in-progress: false

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Add upstream remote
        # Upstream is a public repository, so ls-remote and the single-tag fetch
        # the probe performs need no credentials.
        run: git remote add upstream https://github.com/NanmiCoder/cc-haha

      - name: Probe upstream
        id: probe
        env:
          UPSTREAM_SYNC_REPORT_DIR: ${{ runner.temp }}/upstream-sync
        # Default mode is read-only and always exits 0; the verdict travels as
        # step outputs. --strict is deliberately not used here: a conflicting
        # probe must reach the issue step, not fail the run.
        run: bun run upstream:check --base main

      - name: Maintain tracker issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ steps.probe.outputs.action }}
          TAG: ${{ steps.probe.outputs.tag }}
          VERSION: ${{ steps.probe.outputs.version }}
          CONFLICTS: ${{ steps.probe.outputs.conflicts }}
          CONFLICT_FILES: ${{ steps.probe.outputs.conflict_files }}
          LABEL: upstream-probe
          TITLE: 上游同步盯梢
        run: |
          set -euo pipefail

          gh label create "$LABEL" \
            --repo "$REPOSITORY" \
            --description "上游 release 同步状态盯梢（只读，自动维护）" \
            --color 0e8a16 \
            --force >/dev/null

          existing=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --label "$LABEL" \
            --json number \
            --jq 'first.number // empty')

          case "$ACTION" in
            already-synced | none)
              if [ -n "$existing" ]; then
                gh issue close "$existing" \
                  --repo "$REPOSITORY" \
                  --comment "探测：已同步至 ${TAG:-最新上游 release}，盯梢关闭。"
              fi
              echo "up to date; nothing to track"
              exit 0
              ;;
          esac

          list=""
          if [ -n "$CONFLICT_FILES" ]; then
            list=$(printf '%s\n' "$CONFLICT_FILES" | sed 's/^/- `/;s/$/`/')
          fi

          {
            echo "## 上游同步盯梢"
            echo
            echo "- 探测时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 当前 fork 版本：\`$VERSION\`"
            echo "- 判定：\`$ACTION\`"
            echo "- 目标上游 release：\`$TAG\`"
            echo "- 冲突文件：**$CONFLICTS**"
            echo
            if [ -n "$list" ]; then
              echo "<details><summary>冲突文件清单</summary>"
              echo
              echo "$list"
              echo
              echo "</details>"
              echo
            fi
            echo "### 下一步（\`docs/internals/contributing.md\`「上游同步」）"
            echo
            echo "1. \`bun run upstream:check --base main\` 复确认并保存报告（含本次要归并的 release note 清单）"
            echo "2. \`bun run upstream:sync\` 先发布同步分支 —— 第 4 步要从 \`origin\` 拉它，顺序不能反"
            echo "3. \`git worktree add ../EchoFlow-sync-v<版本> sync/upstream-v<版本>\` 建独立 worktree"
            echo "4. \`bun run upstream:resolve\` 合并（会切换所在 checkout 的分支，工作区须干净）"
            echo "5. 先写完整冲突矩阵，再一轮解决；禁止 blanket \`--ours\`/\`--theirs\`"
            echo "6. 归并**每一份**上游 release note 的用户可见内容，再删掉上游 note 文件"
            echo "7. \`bun run upstream:audit\`、provider contract、\`check:policy\`"
            echo "8. 人工确认 \`git add\`/\`git commit\` 后 \`git push origin sync/upstream-v<版本>\`（不是 \`upstream:sync\`：它推的是上游 release commit），再开 PR"
            echo
            echo "本 issue 由 \`.github/workflows/upstream-probe.yml\` 自动维护。冲突解决全程人工：自动化只报告状态，不解决、不提交、不推送。"
          } > "$RUNNER_TEMP/issue-body.md"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md"
            echo "updated issue #$existing"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$TITLE" \
              --label "$LABEL" \
              --body-file "$RUNNER_TEMP/issue-body.md"
          fi
