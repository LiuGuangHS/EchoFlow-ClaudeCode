name: Quality Check

# Manual quality check. Run this before tagging a release to confirm the
# codebase is green. Not push-triggered: during development you push freely
# without CI noise. The release workflow runs its own verification in
# parallel with the build, so this is the pre-tag checkpoint.

on:
  workflow_dispatch:
    inputs:
      skip_desktop:
        description: 'Skip desktop lint/test/build (faster when only server/adapters changed)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: push-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Upstream release audit
        run: bun run upstream:audit

  policy:
    name: policy-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-root-${{ hashFiles('bun.lock') }}

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Policy and gate regressions
        run: bun run check:policy

  server:
    name: server-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-root-${{ hashFiles('bun.lock') }}

      - name: Cache desktop dependencies
        uses: actions/cache@v4
        with:
          path: desktop/node_modules
          key: bun-desktop-${{ hashFiles('desktop/bun.lock') }}

      - name: Cache adapter dependencies
        uses: actions/cache@v4
        with:
          path: adapters/node_modules
          key: bun-adapters-${{ hashFiles('adapters/bun.lock') }}

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile

      - name: Root runtime tests
        run: bun run check:server

      - name: Provider contracts
        run: bun run check:provider-contract

      - name: Desktop/server chat contracts
        run: bun run check:chat-contract

      - name: Deterministic agent flow
        run: bun run check:agent-flow

      - name: Adapter tests
        run: bun run check:adapters

  desktop:
    name: desktop-checks
    if: ${{ !inputs.skip_desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-root-${{ hashFiles('bun.lock') }}

      - name: Cache desktop dependencies
        uses: actions/cache@v4
        with:
          path: desktop/node_modules
          key: bun-desktop-${{ hashFiles('desktop/bun.lock') }}

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Desktop lint, tests, and build
        run: bun run check:desktop

  push-quality-gate:
    name: push-quality-gate
    needs:
      - contract
      - policy
      - server
      - desktop
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        run: |
          failures=0
          require_success() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name ended with result: $result"
              failures=$((failures + 1))
            else
              echo "$name: success"
            fi
          }
          require_selected() {
            local name="$1" expected="$2" result="$3"
            if [ "$expected" = "true" ]; then
              require_success "$name" "$result"
            elif [ "$result" = "skipped" ]; then
              echo "$name: skipped"
            else
              echo "::error::$name was not selected but ended with result: $result"
              failures=$((failures + 1))
            fi
          }
          require_success "contract" "${{ needs.contract.result }}"
          require_success "policy" "${{ needs.policy.result }}"
          require_success "server" "${{ needs.server.result }}"
          require_selected "desktop" "${{ !inputs.skip_desktop }}" "${{ needs.desktop.result }}"
          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
