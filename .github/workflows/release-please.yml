name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release tag to recover (vX.Y.Z); run from main only'
        required: true
        type: string
      release_sha:
        description: 'Full commit SHA already referenced by the release tag'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['desktop--release_created'] }}
      release_sha: ${{ steps.release.outputs['desktop--sha'] }}
      tag_name: ${{ steps.release.outputs['desktop--tag_name'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-release:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Checkout main release history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Resolve peeled release commit
        id: resolve
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.release_sha || needs.release-please.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$WORKFLOW_REF" != refs/heads/main || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publication requires main, a version tag and a full release SHA."
            exit 1
          fi
          release_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [ "${release_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Release tag does not peel to its expected release SHA."
            exit 1
          fi
          git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            # Recovery uses the corrected main workflow but never moves the release tag.
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp |
              jq -e '[.[][] | select(.tag_name == env.RELEASE_TAG)] | length == 1 and (.[0] | .draft == true and (.id | type == "number" and . > 0 and floor == .))' >/dev/null
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: resolve-release
    if: always() && needs.resolve-release.result == 'success'
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      official_release: true
      macos_signing: ${{ vars.MACOS_SIGNING_MODE || 'unsigned' }}
      release_tag: ${{ needs.resolve-release.outputs.release_tag }}
      release_sha: ${{ needs.resolve-release.outputs.release_sha }}
      draft: false
    secrets: inherit
