name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['desktop--release_created'] }}
      release_sha: ${{ steps.release.outputs['desktop--sha'] }}
      tag_name: ${{ steps.release.outputs['desktop--tag_name'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Resolve peeled release commit
        id: resolve
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release Please did not return a full release SHA."
            exit 1
          fi
          release_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [ "${release_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Release Please tag does not peel to its reported release SHA."
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: resolve-release
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      official_release: true
      release_tag: ${{ needs.resolve-release.outputs.release_tag }}
      release_sha: ${{ needs.resolve-release.outputs.release_sha }}
      draft: false
    secrets: inherit
