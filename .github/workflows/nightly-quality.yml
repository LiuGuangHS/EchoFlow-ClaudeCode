name: Full Quality

# Release jobs already cover governance, runtime and desktop on the candidate.
# A manual run owns the full suite itself.
on:
  workflow_call:
    inputs:
      release_sha:
        description: 'Commit validated by the release contract'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skip_coverage:
        description: 'Skip the coverage ratchet (faster smoke of the rest)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-quality-${{ inputs.release_sha || github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  full-deterministic:
    name: full-deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            site/package-lock.json
      # Agent and skill discovery lists files through ripgrep; without it the
      # runtime suites see every created agent as missing (HTTP 500).
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Record Bun version
        id: bun-cache-version
        run: printf 'version=%s\n' "$(bun --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun-cache-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install --frozen-lockfile

      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Install harness dependencies
        run: npm --prefix harness ci

      - name: Mark dependencies ready
        id: dependencies
        run: 'true'

      # No path routing: after setup succeeds, independent checks still run when
      # an earlier lane fails. Do not continue-on-error: any failure keeps the job red.
      # A cancelled run stops rather than starting more expensive checks.
      - name: Policy and gate regressions
        id: policy
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:policy
      - name: Release surface audit
        id: release-surface
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:release-surface
      - name: Product identity consistency
        id: product-identity
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:product-identity
      - name: Public product content audit
        id: public-content
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:upstream-content
      - name: Deterministic agent flow
        id: agent-flow
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:agent-flow
      - name: Agent loop against a mock LLM and recorded traffic
        id: agent-e2e
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run check:agent-e2e
      - name: Independent harness suite
        id: harness
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run --cwd harness test
      - name: Required repository harness audit
        id: harness-audit
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run audit:harness
      - name: Root runtime tests
        id: server
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:server
      - name: Provider contracts
        id: provider-contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run check:provider-contract
      - name: Desktop/server chat contracts
        id: chat-contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run check:chat-contract
      - name: Adapter tests
        id: adapters
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:adapters
      - name: Desktop lint, tests, and build
        id: desktop
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:desktop
      - name: Documentation build and checks
        id: docs
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run check:docs
      - name: Mobile typecheck, lint, and tests
        id: mobile
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run check:mobile
      - name: Setup native Computer Use Rust toolchain
        id: rust-toolchain
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare native Computer Use dependencies
        id: native-dependencies
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: cargo +stable fetch --locked --manifest-path native/agent-desktop/Cargo.toml
      - name: Native Computer Use deterministic checks
        id: native
        if: ${{ !cancelled() && steps.native-dependencies.outcome == 'success' }}
        run: bun run check:agent-desktop
      - name: Electron host checks
        id: electron
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run check:electron
      - name: Persistence upgrade contracts
        id: persistence
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:persistence-upgrade
      - name: Quarantine governance
        id: quarantine
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.release_sha }}
        run: bun run check:quarantine
      - name: Resolve coverage baseline
        id: coverage-base
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.skip_coverage }}
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          base=origin/main
          if [[ -n "$RELEASE_SHA" ]]; then
            # A recovered release can precede main. Exclude the candidate's own tag.
            tag=$(git describe --first-parent --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)
            base=$(git rev-parse "${tag:-HEAD^}^{commit}")
          fi
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Coverage ratchet
        id: coverage
        if: ${{ !cancelled() && steps.coverage-base.outcome == 'success' }}
        env:
          COVERAGE_BASE_REF: ${{ steps.coverage-base.outputs.sha }}
        run: bun run check:coverage

      # Real desktop UI, real permission dialog, mock runtime. Skips with a printed
      # reason when agent-browser is unavailable on the runner rather than failing
      # the whole nightly run.
      - name: Deterministic desktop UI smoke
        id: desktop-ui-smoke
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run check:desktop-ui-smoke

      - name: Summarize every nightly lane
        if: always()
        env:
          LANE_RESULTS: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs'
          const steps = JSON.parse(process.env.LANE_RESULTS)
          const results = Object.entries(steps).map(([id, step]) => ({ id, outcome: step.outcome }))
          mkdirSync('artifacts', { recursive: true })
          writeFileSync('artifacts/nightly-summary.json', JSON.stringify(results, null, 2) + '\n')
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Nightly check outcomes\n\n| Check | Outcome |\n| --- | --- |\n' +
            results.map(({ id, outcome }) => `| ${id} | ${outcome} |`).join('\n') + '\n')
          NODE

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-quality
          path: |
            artifacts/nightly-summary.json
            artifacts/agent-flow/
            artifacts/agent-e2e/
            artifacts/desktop-ui-smoke/
            artifacts/coverage/
          retention-days: 14

  macos-swift-checks:
    name: macos-swift-checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Run macOS Swift XCTest and helper probes
        id: swift
        run: bun run check:swift
      - name: Summarize macOS Swift checks
        if: always()
        run: |
          printf '## Nightly macOS checks\n\n| Check | Outcome |\n| --- | --- |\n| Swift XCTest and helper probes | %s |\n' '${{ steps.swift.outcome }}' >> "$GITHUB_STEP_SUMMARY"

  selection-drift:
    name: selection-drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Record Bun version
        id: bun-cache-version
        run: printf 'version=%s\n' "$(bun --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun-cache-version.outputs.version }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      # A dependency graph that silently stops resolving would quietly downgrade the
      # PR gate to prefix-only routing, which is the failure this repository already
      # shipped. Check the graph against the real tree.
      - name: Module graph health
        if: ${{ !inputs.release_sha }}
        run: bun test ./scripts/pr/module-graph.test.ts
      - name: Impact report on the full tree
        run: |
          git ls-files -z > "$RUNNER_TEMP/full-tree.nul"
          bun run scripts/pr/change-policy.ts --files0 "$RUNNER_TEMP/full-tree.nul" --plan-only
