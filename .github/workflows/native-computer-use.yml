name: Native Computer Use

on:
  pull_request:
    paths:
      - 'native/agent-desktop/**'
      - 'src/utils/computerUse/agentDesktop*'
      - 'src/vendor/computer-use-mcp/agentDesktop*'
      - 'desktop/scripts/native-agent-desktop*'
      - 'scripts/pr/run-agent-desktop-checks*'
      - '.github/workflows/native-computer-use.yml'
  push:
    branches: [main]
    paths:
      - 'native/agent-desktop/**'
      - 'src/utils/computerUse/agentDesktop*'
      - 'src/vendor/computer-use-mcp/agentDesktop*'
      - 'desktop/scripts/native-agent-desktop*'
      - 'scripts/pr/run-agent-desktop-checks*'
      - '.github/workflows/native-computer-use.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-computer-use-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            adapter: agent-desktop-linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            adapter: agent-desktop-windows
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Prepare locked Rust dependencies
        run: cargo +stable fetch --locked --manifest-path native/agent-desktop/Cargo.toml --target ${{ matrix.target }}
      - name: Compile the platform adapter, CLI and test targets offline
        run: cargo +stable check --locked --offline --manifest-path native/agent-desktop/Cargo.toml -p agent-desktop -p ${{ matrix.adapter }} --all-targets --target ${{ matrix.target }}
      # Skip the Linux repeat only when PR Quality owns the same Rust suite.
      - name: Resolve Linux test owner
        id: scope
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_HEAD" ]]; then
            git diff --name-only -z "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/native-paths"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only -z "$BEFORE" HEAD > "$RUNNER_TEMP/native-paths"
          else
            git diff --name-only -z HEAD^ HEAD > "$RUNNER_TEMP/native-paths"
          fi
          bun run scripts/pr/change-policy.ts --files0 "$RUNNER_TEMP/native-paths" --plan-only
      - name: Run deterministic core, cursor and CLI tests in an isolated home
        if: steps.scope.outputs.desktop_native_checks != 'true'
        run: bun run check:agent-desktop
